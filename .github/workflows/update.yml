name: Download Drama HTMLs

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间凌晨 3 点
  workflow_dispatch:

jobs:
  download-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Downloader
        run: node download.js

      - name: Commit HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add html/
          git commit -m "Auto update HTML files" || exit 0
          git push
